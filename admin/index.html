<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Content Admin — Throne of Families and Nations Fellowship</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: sans-serif;
      background: #0F1B33;
      margin: 0;
    }
    #cms-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0F1B33;
      color: #E5E9F0;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    #cms-loading .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #E5C158;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }
    #cms-loading p {
      margin: 4px 0;
      font-size: 15px;
      opacity: 0.85;
    }
    #cms-loading .sub {
      font-size: 13px;
      opacity: 0.55;
    }
    #cms-loading.error .spinner {
      display: none;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Overlay shown until Decap CMS finishes loading; hidden automatically once it mounts -->
  <div id="cms-loading">
    <div class="spinner"></div>
    <p id="cms-loading-text">Loading admin panel…</p>
    <p class="sub" id="cms-loading-sub">This can take a little longer on a slow connection.</p>
  </div>

  <script>
    // Mobile OAuth relay: if api/callback.js stashed a login message because
    // window.opener wasn't available, replay it now that Decap CMS is about
    // to mount and can attach its own listener for it.
    (function() {
      var relayed = sessionStorage.getItem('decap-cms-oauth-relay');
      if (!relayed) return;
      sessionStorage.removeItem('decap-cms-oauth-relay');
      function fireRelay(attempt) {
        window.postMessage(relayed, window.location.origin);
        if (attempt < 5) setTimeout(function() { fireRelay(attempt + 1); }, 500);
      }
      // Give Decap CMS a moment to mount and attach its own listener.
      setTimeout(function() { fireRelay(0); }, 800);
    })();

    // Hides the loading overlay once the CMS script has actually finished
    // loading and had a moment to render, so it doesn't sit on top forever.
    function hideCmsLoading() {
      var el = document.getElementById('cms-loading');
      if (el) el.style.display = 'none';
    }

    // If the script never loads at all (blocked, offline, CDN down), stop
    // spinning forever and say so instead of hanging silently.
    function cmsLoadFailed() {
      var el = document.getElementById('cms-loading');
      if (!el) return;
      el.classList.add('error');
      document.getElementById('cms-loading-text').textContent = 'Couldn\'t load the admin panel.';
      document.getElementById('cms-loading-sub').textContent = 'Check your connection and reload the page.';
    }

    // Safety net: if nothing has hidden the overlay within 45s, treat it as failed.
    var cmsLoadTimeout = setTimeout(cmsLoadFailed, 45000);
  </script>

  <!-- Decap CMS (free, open-source, git-based — no server for Nexus to run).
       Pinned to an exact version rather than a ^range so the browser hits
       the file directly, skipping unpkg's extra version-resolution request. -->
  <script
    src="https://unpkg.com/decap-cms@3.16.0/dist/decap-cms.js"
    onload="clearTimeout(cmsLoadTimeout); setTimeout(hideCmsLoading, 300);"
    onerror="clearTimeout(cmsLoadTimeout); cmsLoadFailed();"
  ></script>
</body>
</html>
