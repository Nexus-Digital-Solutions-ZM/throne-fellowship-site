<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager | Throne of Families and Nations</title>
</head>
<body>
  <!--
    decap-cms.js is the fully-bundled build (React, ReactDOM, widgets and
    built-in backends are inside it) — do NOT load React separately.

    Step 1 (this inline script, runs BEFORE Decap loads):
      - Capture the one-time #nexus_handoff token into
        window.__NEXUS_HANDOFF__ and clear it from the URL. Decap uses
        hash routing, so if the token is still in the hash when it boots
        it tries to open the route "#/nexus_handoff=..." and shows
        "Not Found". Clearing it first means Decap starts on a clean
        "#/" and goes to the first collection.
      - Set CMS_MANUAL_INIT so Decap waits for us to register the Nexus
        Gateway backend before reading config.yml.
  -->
  <script>
    (function () {
      var m = /(?:^|[#&])\/?nexus_handoff=([^&]+)/.exec(window.location.hash || "");
      if (m) {
        window.__NEXUS_HANDOFF__ = decodeURIComponent(m[1]);
        window.history.replaceState(null, "", window.location.pathname + window.location.search);
      }
    })();
    window.CMS_MANUAL_INIT = true;
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="nexus-gateway-backend.js"></script>
  <script>
    CMS.registerBackend("nexus-gateway", window.NexusGatewayBackend);
    CMS.init();
  </script>
</body>
</html>
