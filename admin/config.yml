backend:
  name: nexus-gateway

# Custom Decap backend (admin/nexus-gateway-backend.js) that talks to the
# Nexus CMS Gateway instead of GitHub directly. Auth happens via a
# one-time handoff link from the Gateway ("Edit this site" button) —
# there is no login form here. The old GitHub OAuth backend and the
# /api/auth /api/callback Vercel functions are no longer used by this
# admin UI (left in place, not deleted, in case anything else depends on
# them).
# repo/branch/base_url/auth_endpoint are no longer read by this backend;
# kept commented for reference only.
# repo: Nexus-Digital-Solutions-ZM/throne-fellowship-site
# branch: main
# base_url: https://throneoffamiliesandnations.org
# auth_endpoint: api/auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: simple

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "1-2 sentences shown in the Latest Updates preview and blog listing." }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "testimonies"
    label: "Testimonies"
    folder: "content/testimonies"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Person (optional, may withhold)", name: "name", widget: "string", required: false }
      - { label: "Date Received", name: "date", widget: "datetime" }
      - { label: "Testimony Screenshot / Photo", name: "image", widget: "image", required: false }
      - { label: "Testimony Text", name: "body", widget: "text", hint: "Quote or summary of the testimony, in the sender's own words where possible." }
    # Entries here are stored as markdown in content/testimonies/ and rendered
    # into testimonies.html by scripts/build-testimonies.js on every deploy
    # (same pattern as the blog). Newest first, by "Date Received".
    # Nothing else needs doing - publish here and it appears on the site.
